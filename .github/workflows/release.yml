name: Release

# Push a tag like v0.2.0 to build installers for every platform and publish them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libgtk-3-dev patchelf rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "LocalSendStudio ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    # Builds a signed APK when the signing secrets exist (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
    # ANDROID_KEY_ALIAS). Without them this job is skipped and the APK is built locally (see docs/BUILD.md).
    if: ${{ vars.BUILD_ANDROID == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sdkmanager "ndk;26.1.10909125" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: npx tauri android build --apk --target aarch64 --target armv7
      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          APK=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASS --ks-key-alias "$KEY_ALIAS" --out LocalSendStudio-${{ github.ref_name }}.apk "$APK"
          rm release.jks
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: LocalSendStudio-${{ github.ref_name }}.apk

  checksums:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern '*' --clobber
          rm -f SHA256SUMS.txt
          sha256sum * > ../SHA256SUMS.txt
          cd .. && gh release upload "${{ github.ref_name }}" SHA256SUMS.txt --repo "${{ github.repository }}" --clobber
